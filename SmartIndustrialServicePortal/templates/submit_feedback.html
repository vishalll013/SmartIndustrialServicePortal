{% extends 'base.html' %}

{% block title %}Submit Feedback - Smart Industrial Portal{% endblock %}
{% block header_title %}Submit Feedback{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h3 class="card-title">Share Your Experience</h3>
    <form action="/feedback" method="POST">
        <div class="form-group">
            <label style="margin-bottom: 0.75rem; display: block;">How would you rate your overall experience with the portal?</label>
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" required />
                <label for="star5" title="5 stars">★</label>
                <input type="radio" id="star4" name="rating" value="4" />
                <label for="star4" title="4 stars">★</label>
                <input type="radio" id="star3" name="rating" value="3" />
                <label for="star3" title="3 stars">★</label>
                <input type="radio" id="star2" name="rating" value="2" />
                <label for="star2" title="2 stars">★</label>
                <input type="radio" id="star1" name="rating" value="1" />
                <label for="star1" title="1 star">★</label>
            </div>
        </div>

        <div class="form-group" style="margin-top: 2rem;">
            <label for="feedback">Detailed Comments</label>
            <textarea id="feedback" name="feedback" rows="6" required placeholder="Please let us know what you think of our service portal, any feature requests, or areas of improvement."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">Submit Feedback</button>
            <a href="/dashboard" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
